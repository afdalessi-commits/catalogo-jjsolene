<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJ Solene — Sistema de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#6b1f33; --wine-dark:#4a1523; --wine-light:#8a3350; --gold:#c9a15a;
    --cream:#f7efe2; --cream2:#fffaf3; --text:#2b1a1f; --muted:#8a7568;
    --border:#e8dcc8; --danger:#b3261e; --success:#2e7d32; --warn:#a9720c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--cream);color:var(--text);}
  h1,h2,h3,h4{font-family:'Playfair Display',serif;margin:0 0 4px;}
  a{color:var(--wine);}
  button{font-family:'Poppins',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Poppins',sans-serif;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13.5px;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--wine-light);}
  table{border-collapse:collapse;width:100%;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.4px;}
  .hidden{display:none !important;}
  /* Auth */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--wine),var(--wine-dark));padding:20px;}
  .auth-card{background:#fff;border-radius:16px;padding:34px 32px;max-width:430px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .auth-card h2{color:var(--wine-dark);}
  .auth-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
  .auth-card .field{margin-bottom:12px;}
  .auth-card .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .auth-card .field input{width:100%;}
  .auth-error{color:var(--danger);font-size:12.5px;margin-top:10px;}
  .auth-link{font-size:12px;color:var(--wine);text-decoration:underline;cursor:pointer;margin-top:14px;display:inline-block;}
  .auth-note{background:#fbf6ee;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
  /* App shell */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex:none;background:var(--wine-dark);color:#f5e9dd;display:flex;flex-direction:column;padding:22px 0;}
  .brand{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:14px;}
  .brand .logo{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:0.5px;}
  .brand .sub{font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 22px;font-size:14px;font-weight:500;color:#e6d4c3;cursor:pointer;border-left:3px solid transparent;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.06);}
  .nav-item.active{background:rgba(255,255,255,0.09);border-left-color:var(--gold);color:#fff;font-weight:600;}
  .nav-icon{font-size:16px;width:20px;text-align:center;}
  .nav-badge{background:var(--gold);color:#3a2a10;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:auto;}
  .sidebar-foot{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,0.12);}
  .sidebar-foot .who{font-size:11.5px;color:#cbb6a5;margin-bottom:8px;word-break:break-all;}
  .logout-btn{font-size:12.5px;color:#f5e9dd;background:rgba(255,255,255,0.08);border:none;padding:7px 12px;border-radius:8px;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.16);}
  .main{flex:1;padding:26px 34px 60px;max-width:1280px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .topbar .today{font-size:13px;color:var(--muted);}
  .page-title{font-size:26px;color:var(--wine-dark);}
  .page-desc{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .card{background:var(--cream2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:0 4px 14px rgba(107,31,51,0.05);overflow-x:auto;}
  .card table{min-width:560px;}
  .mobile-menu-btn{display:none;background:none;border:none;font-size:22px;line-height:1;color:var(--wine-dark);cursor:pointer;padding:4px 8px;margin-right:8px;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(30,10,16,0.5);z-index:40;}
  .sidebar-overlay.show{display:block;}
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:linear-gradient(135deg,var(--wine),var(--wine-dark));color:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 8px 20px rgba(107,31,51,0.25);}
  .kpi .label{font-size:11.5px;letter-spacing:0.8px;text-transform:uppercase;opacity:0.8;}
  .kpi .value{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;margin-top:6px;}
  .kpi.alt{background:linear-gradient(135deg,#c9a15a,#a9812f);}
  .section-title{font-size:15px;font-weight:700;color:var(--wine-dark);margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13px;color:#fff;background:var(--wine);}
  .btn:hover{background:var(--wine-dark);}
  .btn.gold{background:var(--gold);color:#3a2a10;}
  .btn.gold:hover{background:#b78e46;}
  .btn.outline{background:#fff;color:var(--wine);border:1.5px solid var(--wine);}
  .btn.outline:hover{background:var(--cream);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn.full{width:100%;}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;}
  .form-block{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
  .form-block h4{color:var(--wine-dark);font-size:14px;margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .field{display:flex;flex-direction:column;}
  .field input,.field select,.field textarea{width:100%;}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .tag.ok{background:#e3f2e1;color:var(--success);}
  .tag.warn{background:#fbeecb;color:var(--warn);}
  .tag.bad{background:#fbe1de;color:var(--danger);}
  .tag.info{background:#eee0e6;color:var(--wine);}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;border:1.5px dashed var(--border);border-radius:12px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .items-editor{border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:#fbf6ee;}
  .items-editor .item-line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;font-size:12.5px;}
  .items-editor .total-line{text-align:right;font-weight:700;color:var(--wine-dark);margin-top:6px;font-size:14px;}
  .hidden{display:none !important;}
  .switch{position:relative;display:inline-block;width:38px;height:21px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:999px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--wine);}
  input:checked + .slider:before{transform:translateX(17px);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--wine-dark);color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:999;opacity:0;transform:translateY(10px);transition:.25s;max-width:340px;}
  .toast.show{opacity:1;transform:translateY(0);}
  .note{font-size:12px;color:var(--muted);background:#fbf6ee;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5;}
  .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .product-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;}
  .product-photo-thumb{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#eee2d3;}
  .product-card .pname{font-weight:700;font-size:14px;color:var(--wine-dark);}
  .product-card .pmeta{font-size:11.5px;color:var(--muted);}
  .product-card .pprice{font-weight:700;color:var(--wine);font-size:15px;}
  .size-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .size-pill{font-size:11px;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--text);}
  .size-pill.low{background:#fbe1de;color:var(--danger);border-color:#f0bdb6;}
  .upload-preview{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin-top:8px;display:block;}
  .modal-bg{position:fixed;inset:0;background:rgba(43,26,31,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{background:#fff;border-radius:14px;padding:22px 24px;max-width:540px;width:100%;max-height:88vh;overflow:auto;}
  .pedido-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  .pedido-card.pendente{border-left:4px solid var(--warn);}
  .pedido-card.confirmado{border-left:4px solid var(--success);}
  .pedido-card.cancelado{border-left:4px solid var(--muted);opacity:0.7;}
  .pedido-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .pedido-items{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.6;}
  @media(max-width:860px){
    .mobile-menu-btn{display:inline-block;}
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:16px 14px 50px;max-width:100%;}
    .page-title{font-size:20px;}
    .form-row{grid-template-columns:1fr;}
    .grid-3{grid-template-columns:1fr;}
    .items-editor .item-line{grid-template-columns:1fr 1fr;font-size:12px;row-gap:4px;}
    .auth-card{padding:26px 22px;}
  }
  @media(max-width:480px){
    .grid-4{grid-template-columns:1fr;}
  }
</style>
</head>

function fmtMoney(n){ n = Number(n)||0; return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderConnectScreen(prefillError){
  document.getElementById('appRoot').classList.add('hidden');

    '<h2>Conectar ao banco de dados</h2>' +

    '</div></div>';

function submitConnect(){
  const url = document.getElementById('conn_url').value.trim();
  const key = document.getElementById('conn_key').value.trim();
  if(!url || !key || !url.startsWith('http')){ toast('Confira a URL e a chave.'); return; }
  localStorage.setItem(SB_URL_KEY, url);
  localStorage.setItem(SB_ANON_KEY, key);
  initClient(url, key);
}
function resetConnection(){
  localStorage.removeItem(SB_URL_KEY);
  localStorage.removeItem(SB_ANON_KEY);
  SUPA = null;
  renderConnectScreen();
}
function initClient(url, key){
  try{
    SUPA = window.supabase.createClient(url, key);
  }catch(e){
    renderConnectScreen('Não foi possível conectar: '+e.message);
    return;
  }
  SUPA.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ currentUser = null; renderLoginScreen(); }
  });
  checkSession();
}
async function checkSession(){
  const { data, error } = await SUPA.auth.getSession();
  if(error){ renderConnectScreen('Erro de conexão: '+error.message); return; }
  if(data && data.session){
    currentUser = data.session.user;
    enterApp();
  } else {
    renderLoginScreen();
  }
}
function renderLoginScreen(errorMsg){
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('authScreen').innerHTML =
    '<div class="auth-wrap"><div class="auth-card">' +
    '<h2>JJ Solene</h2>' +
    '<div class="sub">Entre com o login criado no Supabase (Authentication → Users).</div>' +
    '<div class="field"><label>E-mail</label><input id="login_email" type="email"></div>' +
    '<div class="field"><label>Senha</label><input id="login_pass" type="password"></div>' +
    (errorMsg ? '<div class="auth-error">'+escapeHtml(errorMsg)+'</div>' : '') +
    '<button class="btn full" onclick="submitLogin()">Entrar</button>' +
    '<span class="auth-link" onclick="resetConnection()">Trocar conexão com o banco de dados</span>' +
    '</div></div>';
}
async function submitLogin(){
  const email = document.getElementById('login_email').value.trim();
  const pass = document.getElementById('login_pass').value;
  const { data, error } = await SUPA.auth.signInWithPassword({ email, password: pass });
  if(error){ renderLoginScreen(error.message); return; }
  currentUser = data.user;
  enterApp();
}
async function doLogout(){
  await SUPA.auth.signOut();
  currentUser = null;
  document.getElementById('appRoot').classList.add('hidden');
  renderLoginScreen();
}
async function enterApp(){

async function getSettings(){

}
async function getCategories(force){
  if(categoriesCache && !force) return categoriesCache;
  categoriesCache = await q(SUPA.from('categories').select('*').order('sort_order').order('name'));
  return categoriesCache;
}
function categoryName(cats, id){
  const c = cats.find(x=>x.id===id);
  return c ? c.name : '—';
}
function stockTotal(sizes){ return (sizes||[]).reduce((s,x)=> s+(Number(x.stock)||0), 0); }
function reservedTotal(sizes){ return (sizes||[]).reduce((s,x)=> s+(Number(x.reserved)||0), 0); }

/* ============================================================
   DASHBOARD
   ============================================================ */
let dashboardCache = null;
let dashValuesHidden = localStorage.getItem('jj_dash_hide_values') === '1';
async function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const [products, settings, pendentesOrders] = await Promise.all([
    q(SUPA.from('products').select('id,name,cost_price,sale_price,product_sizes(size,stock,reserved)')),
    getSettings(),
    q(SUPA.from('orders').select('id,customer,total,date').eq('status','pendente').order('date',{ascending:false}))
  ]);
  const monthStart = todayISO().slice(0,7)+'-01';
  const [salesMonth, financeAll] = await Promise.all([
    q(SUPA.from('sales').select('total').gte('date', monthStart)),
    q(SUPA.from('finance').select('type,amount,status,date,description').order('date',{ascending:false}))
  ]);

  let totalCusto = 0, totalVenda = 0;
  const baixoEstoque = [];
  products.forEach(p=>{
    const total = stockTotal(p.product_sizes);
    totalCusto += total * (Number(p.cost_price)||0);
    totalVenda += total * (Number(p.sale_price)||0);
    (p.product_sizes||[]).forEach(sz=>{
      const disponivel = (Number(sz.stock)||0) - (Number(sz.reserved)||0);
      if(disponivel <= 2) baixoEstoque.push({name:p.name, size:sz.size, disponivel});
    });
  });
  const totalVendasMes = salesMonth.reduce((s,v)=> s+Number(v.total||0), 0);
  const receitas = financeAll.filter(f=>f.type==='receita').reduce((s,f)=> s+Number(f.amount||0), 0);
  const despesas = financeAll.filter(f=>f.type==='despesa').reduce((s,f)=> s+Number(f.amount||0), 0);
  const saldo = receitas - despesas;
  const pendentesFinance = financeAll.filter(f=> f.status==='pendente');

  dashboardCache = {
    settings, pendentesOrders, salesMonth, baixoEstoque, pendentesFinance,
    totalCusto, totalVenda, totalVendasMes, saldo
  };
  renderDashboardHTML();
}
function toggleDashboardValues(){
  dashValuesHidden = !dashValuesHidden;
  localStorage.setItem('jj_dash_hide_values', dashValuesHidden ? '1' : '0');
  renderDashboardHTML();
}
function dMoney(v){ return dashValuesHidden ? 'R$ ••••••' : fmtMoney(v); }
function renderDashboardHTML(){
  const el = document.getElementById('tab-dashboard');
  if(!dashboardCache || !el) return;
  const { settings, pendentesOrders, salesMonth, baixoEstoque, pendentesFinance, totalCusto, totalVenda, totalVendasMes, saldo } = dashboardCache;

  let html = '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">';
  html += '<button class="btn small outline" onclick="toggleDashboardValues()">'+(dashValuesHidden ? '👁️ Mostrar valores' : '🙈 Ocultar valores')+'</button>';
  html += '</div>';

  html += '<div class="grid grid-4">';
  html += kpiCard('Estoque (valor de custo)', dMoney(totalCusto));
  html += kpiCard('Estoque (valor de venda)', dMoney(totalVenda), true);
  html += kpiCard('Vendas do mês', dMoney(totalVendasMes) + ' · ' + salesMonth.length + ' pedido(s)');
  html += kpiCard('Saldo financeiro', dMoney(saldo), saldo<0);
  html += '</div>';

  if(pendentesOrders.length){
    html += '<div class="section-title">🔔 Pedidos do catálogo aguardando confirmação ('+pendentesOrders.length+')</div>';
    html += '<div class="card"><table><tr><th>Data</th><th>Cliente</th><th>Total</th></tr>';
    pendentesOrders.slice(0,6).forEach(o=>{
      html += '<tr><td>'+fmtDate(o.date)+'</td><td>'+escapeHtml(o.customer||'—')+'</td><td>'+dMoney(o.total)+'</td></tr>';
    });
    html += '</table><button class="btn small" style="margin-top:10px;" onclick="showTab(\'pedidos\')">Ver todos</button></div>';
  }

  html += '<div class="section-title">⚠️ Estoque baixo (2 unidades disponíveis ou menos)</div>';
  if(baixoEstoque.length===0){
    html += '<div class="empty">Nenhum item com estoque baixo no momento.</div>';
  } else {
    html += '<div class="card"><table><tr><th>Produto</th><th>Tamanho</th><th>Disponível</th></tr>';
    baixoEstoque.forEach(x=>{
      html += '<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(x.size)+'</td><td>'+x.disponivel+'</td></tr>';
    });
    html += '</table></div>';
  }

  html += '<div class="section-title">💳 Contas pendentes (financeiro)</div>';
  if(pendentesFinance.length===0){
    html += '<div class="empty">Nenhuma conta pendente.</div>';
  } else {
    html += '<div class="card"><table><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr>';
    pendentesFinance.slice(0,8).forEach(f=>{
      html += '<tr><td>'+fmtDate(f.date)+'</td><td>'+(f.type==='receita'?'A receber':'A pagar')+'</td><td>'+escapeHtml(f.description)+'</td><td>'+dMoney(f.amount)+'</td></tr>';
    });
    html += '</table></div>';
  }

  html += '<div class="section-title">🌐 Catálogo público</div>';
  html += '<div class="card">'+
    '<div style="font-size:13.5px;margin-bottom:8px;">Última publicação: <strong>'+(settings.last_catalog_generated ? fmtDate(settings.last_catalog_generated) : 'ainda não publicado')+'</strong></div>'+
    '<button class="btn gold" onclick="showTab(\'catalogo\')">Ir para o Catálogo</button>'+
    '</div>';

  el.innerHTML = html;
  refreshPedidosBadge();
}
function kpiCard(label, value, altOrDanger){
  const cls = altOrDanger ? 'kpi alt' : 'kpi';
  return '<div class="'+cls+'"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>';
}

/* ============================================================
   PEDIDOS (fila do catálogo)
   ============================================================ */
async function renderPedidos(){
  const el = document.getElementById('tab-pedidos');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const orders = await q(SUPA.from('orders').select('*, order_items(*, products(name))').order('date',{ascending:false}).limit(100));
  const pendentes = orders.filter(o=>o.status==='pendente');
  const outros = orders.filter(o=>o.status!=='pendente');

  let html = '<div class="page-desc">Pedidos feitos pelo catálogo público. Ao confirmar, vira venda de verdade (baixa o estoque e lança a receita). Ao cancelar, libera o estoque reservado.</div>';
  html += '<div class="section-title">Aguardando confirmação ('+pendentes.length+')</div>';
  if(pendentes.length===0){
    html += '<div class="empty">Nenhum pedido pendente.</div>';
  } else {
    pendentes.forEach(o=>{ html += pedidoCardHtml(o); });
  }
  html += '<div class="section-title">Histórico</div>';
  if(outros.length===0){
    html += '<div class="empty">Nenhum pedido no histórico ainda.</div>';
  } else {
    outros.slice(0,30).forEach(o=>{ html += pedidoCardHtml(o); });
  }
  el.innerHTML = html;
}
function pedidoCardHtml(o){
  const itemsTxt = (o.order_items||[]).map(it=> (it.products?it.products.name:'?') + ' (Tam '+it.size+') x'+it.qty).join(' · ');
  let html = '<div class="pedido-card '+o.status+'">';
  html += '<div class="pedido-head"><div><strong>'+escapeHtml(o.customer||'Cliente não identificado')+'</strong> · '+fmtDate(o.date)+'</div><div>'+
    (o.status==='pendente'?'<span class="tag warn">Pendente</span>':o.status==='confirmado'?'<span class="tag ok">Confirmado</span>':'<span class="tag bad">Cancelado</span>')+
    '</div></div>';
  html += '<div class="pedido-items">'+escapeHtml(itemsTxt||'sem itens')+'</div>';
  if(o.payment_method==='cartao_infinitepay'){
    html += '<div class="pedido-items"><span class="tag info">Cartão via InfinitePay</span> '+(o.receipt_url ? '<a href="'+escapeHtml(o.receipt_url)+'" target="_blank">Ver comprovante</a>' : '<span style="color:var(--muted);">comprovante ainda não retornou</span>')+'</div>';
  }
  if(o.coupon_code || (o.discount_amount>0) || o.gift_product_id){
    let extras = [];
    if(o.coupon_code) extras.push('Cupom: '+escapeHtml(o.coupon_code));
    if(o.discount_amount>0) extras.push('Desconto: '+fmtMoney(o.discount_amount));
    if(o.gift_product_id) extras.push('🎁 Inclui brinde');
    html += '<div class="pedido-items">'+extras.join(' · ')+'</div>';
  }
  html += '<div style="display:flex; justify-content:space-between; align-items:center;">';
  html += '<strong>'+fmtMoney(o.total)+'</strong>';
  if(o.status==='pendente'){
    html += '<div class="row-actions"><button class="btn small" onclick="confirmOrderAction(\''+o.id+'\')">Confirmar pagamento</button><button class="btn small danger" onclick="cancelOrderAction(\''+o.id+'\')">Cancelar</button></div>';
  }
  html += '</div></div>';
  return html;
}
async function confirmOrderAction(id){
  if(!confirm('Confirmar este pedido como pago? Isso vai baixar o estoque e lançar a receita no financeiro.')) return;
  await q(SUPA.rpc('confirm_order', { p_order_id: id }));
  toast('Pedido confirmado. Venda registrada.');
  await renderPedidos();
  refreshPedidosBadge();
}
async function cancelOrderAction(id){
  if(!confirm('Cancelar este pedido? O estoque reservado será liberado.')) return;
  await q(SUPA.rpc('cancel_order', { p_order_id: id }));
  toast('Pedido cancelado.');
  await renderPedidos();
  refreshPedidosBadge();
}

async function renderEstoque(){
  const el = document.getElementById('tab-estoque');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const [products, cats] = await Promise.all([
    q(SUPA.from('products').select('*, product_sizes(*)').order('name')),
    getCategories()
  ]);
  let html = '<div class="page-desc">Cadastre produtos, fotos, tamanhos e quantidades. O estoque é atualizado automaticamente por Compras, Vendas e Pedidos do catálogo.</div>';
  html += '<button class="btn" onclick="openProductForm()">+ Novo produto</button>';
  html += '<div class="section-title">Produtos cadastrados ('+products.length+')</div>';
  if(products.length===0){
    html += '<div class="empty">Nenhum produto cadastrado ainda. Clique em "+ Novo produto" para começar.</div>';
  } else {
    html += '<div class="products-grid">';
    products.forEach(p=>{
      const total = stockTotal(p.product_sizes);
      const reserved = reservedTotal(p.product_sizes);
      html += '<div class="product-card">';
      if(p.image_url){ html += '<img class="product-photo-thumb" src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">'; }
      else { html += '<div class="product-photo-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;">sem foto</div>'; }
      html += '<div class="pname">'+escapeHtml(p.name)+'</div>';
      html += '<div class="pmeta">'+escapeHtml(categoryName(cats, p.category_id))+' · SKU '+escapeHtml(p.sku||'—')+'</div>';
      html += '<div class="pprice">'+fmtMoney(p.sale_price)+' <span style="font-size:11px;color:var(--muted);font-weight:400;">(custo '+fmtMoney(p.cost_price)+')</span></div>';
      html += '<div class="size-pills">';
      (p.product_sizes||[]).forEach(sz=>{
        const disp = (Number(sz.stock)||0)-(Number(sz.reserved)||0);
        html += '<span class="size-pill'+(disp<=2?' low':'')+'">'+escapeHtml(sz.size)+': '+disp+(sz.reserved>0?' ('+sz.reserved+' reserv.)':'')+'</span>';
      });
      html += '</div>';
      html += '<div class="pmeta">Estoque total: <strong>'+total+'</strong>'+(reserved>0?' · '+reserved+' reservado(s)':'')+' · '+(p.show_in_catalog!==false?'<span class="tag ok">no catálogo</span>':'<span class="tag warn">oculto</span>')+'</div>';
      html += '<div class="row-actions" style="margin-top:6px;"><button class="btn small outline" onclick="openProductForm(\''+p.id+'\')">Editar</button><button class="btn small danger" onclick="deleteProduct(\''+p.id+'\')">Excluir</button></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

async function openProductForm(id){
  const cats = await getCategories();
  let p = { id:null, sku:'', name:'', category_id: cats[0]?cats[0].id:'', cost_price:0, sale_price:0, description:'', promo_text:'', show_in_catalog:true, image_url:'', ncm:'', color:'', discount_type:'none', discount_value:0, discount_min_qty:1, product_sizes:[{size:'P',stock:0,barcode:''},{size:'M',stock:0,barcode:''},{size:'G',stock:0,barcode:''}] };
  let media = [];
  if(id){
    const rows = await q(SUPA.from('products').select('*, product_sizes(*)').eq('id', id));
    if(rows[0]) p = rows[0];
    media = await q(SUPA.from('product_media').select('*').eq('product_id', id).order('sort_order'));
  }
  window._currentProductMedia = media;
  const catOptions = cats.map(c=>'<option value="'+c.id+'"'+(c.id===p.category_id?' selected':'')+'>'+escapeHtml(c.icon+' '+c.name)+'</option>').join('');

function renderMediaGalleryThumbs(media){
  return (media||[]).map(m=>{
    if(m.media_type==='video'){
      return '<div style="position:relative;"><div style="width:64px;height:64px;background:#222;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;">▶</div><button type="button" onclick="removeMediaItem(\''+m.id+'\')" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;">×</button></div>';
    }
    return '<div style="position:relative;"><img src="'+escapeHtml(m.url)+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px;"><button type="button" onclick="removeMediaItem(\''+m.id+'\')" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;">×</button></div>';
  }).join('');
}
async function removeMediaItem(mediaId){
  if(mediaId && !String(mediaId).startsWith('new_')){
    await q(SUPA.from('product_media').delete().eq('id', mediaId));
  }
  window._currentProductMedia = (window._currentProductMedia||[]).filter(m=>m.id!==mediaId);
  document.getElementById('f_media_gallery').innerHTML = renderMediaGalleryThumbs(window._currentProductMedia);
}
function addVideoToGallery(){
  const input = document.getElementById('f_video_url');
  const url = input.value.trim();
  if(!url){ toast('Cole o link do vídeo primeiro.'); return; }
  const item = { id: 'new_'+Date.now(), url, media_type:'video', _pending:true };
  window._currentProductMedia = (window._currentProductMedia||[]).concat([item]);
  document.getElementById('f_media_gallery').innerHTML = renderMediaGalleryThumbs(window._currentProductMedia);
  input.value = '';
}
function previewPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const img = document.getElementById('f_photo_preview');
  img.src = URL.createObjectURL(file);
  img.classList.remove('hidden');
}
function parseSizesInput(str){
  return str.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{
    const parts = s.split(':');
    return { size: (parts[0]||'').trim(), stock: Number(parts[1])||0, barcode: (parts[2]||'').trim() };
  }).filter(s=>s.size);
}
async function saveProduct(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Informe o nome do produto.'); return; }
  const btn = document.getElementById('f_save_btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try{
    const sizes = parseSizesInput(document.getElementById('f_sizes').value);
    const payload = {
      sku: document.getElementById('f_sku').value.trim(),
      name: name,
      category_id: document.getElementById('f_cat').value,
      cost_price: Number(document.getElementById('f_cost').value)||0,
      sale_price: Number(document.getElementById('f_price').value)||0,
      description: document.getElementById('f_desc').value.trim(),
      promo_text: document.getElementById('f_promo').value.trim(),
      show_in_catalog: document.getElementById('f_showcat').checked,
      ncm: document.getElementById('f_ncm').value.trim(),
      color: document.getElementById('f_color').value.trim(),
      discount_type: document.getElementById('f_disc_type').value,
      discount_value: Number(document.getElementById('f_disc_value').value)||0,
      discount_min_qty: Number(document.getElementById('f_disc_minqty').value)||1
    };
    let productId = id;
    if(id){
      await q(SUPA.from('products').update(payload).eq('id', id));
    } else {
      const inserted = await q(SUPA.from('products').insert([payload]).select());
      productId = inserted[0].id;
    }
    if(sizes.length){
      await q(SUPA.from('product_sizes').upsert(
        sizes.map(s=>({ product_id: productId, size: s.size, stock: s.stock, barcode: s.barcode||'' })),
        { onConflict: 'product_id,size' }
      ));
    }
    const fileInput = document.getElementById('f_photo');
    const file = fileInput && fileInput.files[0];
    if(file){
      const path = productId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const { error: upErr } = await SUPA.storage.from('product-images').upload(path, file, { upsert:true });
      if(upErr){
        toast('Produto salvo, mas houve erro no upload da foto: '+upErr.message);
      } else {
        const { data: pub } = SUPA.storage.from('product-images').getPublicUrl(path);
        await q(SUPA.from('products').update({ image_url: pub.publicUrl }).eq('id', productId));
      }
    }
    // galeria: envia novos arquivos de imagem selecionados
    const mediaFilesInput = document.getElementById('f_media_files');
    const mediaFiles = mediaFilesInput ? Array.from(mediaFilesInput.files||[]) : [];
    for(const mf of mediaFiles){
      const path = productId + '/gallery_' + Date.now() + '_' + mf.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
      const { error: upErr } = await SUPA.storage.from('product-images').upload(path, mf, { upsert:true });
      if(!upErr){
        const { data: pub } = SUPA.storage.from('product-images').getPublicUrl(path);
        await q(SUPA.from('product_media').insert([{ product_id: productId, url: pub.publicUrl, media_type:'image' }]));
      }
    }
    // galeria: salva vídeos adicionados (pendentes, ainda não persistidos)
    const pendingVideos = (window._currentProductMedia||[]).filter(m=>m._pending);
    for(const v of pendingVideos){
      await q(SUPA.from('product_media').insert([{ product_id: productId, url: v.url, media_type:'video' }]));
    }
    window._currentProductMedia = [];
    closeModal();
    await renderEstoque();
    toast('Produto salvo.');
  } catch(e){
    btn.disabled = false; btn.textContent = 'Salvar';
  }
}
async function deleteProduct(id){
  if(!confirm('Excluir este produto do estoque? Essa ação não pode ser desfeita.')) return;
  await q(SUPA.from('products').delete().eq('id', id));
  await renderEstoque();
  toast('Produto excluído.');
}

let currentPurchaseItems = [];
let productsLiteCache = null;

async function getProductsLite(force){
  if(productsLiteCache && !force) return productsLiteCache;
  productsLiteCache = await q(SUPA.from('products').select('id,name,sale_price,cost_price,product_sizes(size,stock,reserved)').order('name'));

}

async function renderCompras(){
  const el = document.getElementById('tab-compras');

  let html = '<div class="page-desc">Registre pedidos de compra a fornecedores. Ao marcar como recebido, o estoque e o financeiro são atualizados automaticamente.</div>';
  html += '<button class="btn" onclick="openPurchaseForm()">+ Nova compra</button>';
  html += '<div class="section-title">Histórico de compras ('+purchases.length+')</div>';

    html += '<div class="empty">Nenhuma compra registrada ainda.</div>';

async function openPurchaseForm(){
  currentPurchaseItems = [];
  const products = await getProductsLite(true);
  let html = '<h3>Nova compra</h3>';
  html += '<div class="form-row"><div class="field"><label>Fornecedor</label><input id="pu_supplier" placeholder="Nome do fornecedor"></div><div class="field"><label>Data</label><input id="pu_date" type="date" value="'+todayISO()+'"></div></div>';
  html += '<div id="pu_items_area"></div>';
  html += '<div class="form-row" style="align-items:end;">';
  html += '<div class="field"><label>Produto</label><select id="pu_prod">'+products.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>').join('')+'</select></div>';
  html += '<div class="field"><label>Tamanho</label><input id="pu_size" placeholder="Ex: M"></div>';
  html += '<div class="field"><label>Qtd</label><input id="pu_qty" type="number" value="1" min="1"></div>';
  html += '<div class="field"><label>Custo unit. (R$)</label><input id="pu_cost" type="number" step="0.01" value="0"></div>';
  html += '</div>';
  html += '<button class="btn outline small" onclick="addPurchaseItem()">+ Adicionar item</button>';
  html += '<div class="row-actions" style="margin-top:16px;"><button class="btn" onclick="savePurchase()">Salvar compra (pendente)</button><button class="btn outline" onclick="closeModal()">Cancelar</button></div>';
  openModal(html);
  if(products.length===0){
    document.getElementById('pu_items_area').innerHTML = '<div class="note">Cadastre produtos no Estoque antes de lançar uma compra.</div>';
  } else {
    renderPurchaseItemsArea(products);
  }

function addPurchaseItem(){
  const productId = document.getElementById('pu_prod').value;
  const size = document.getElementById('pu_size').value.trim() || 'Único';
  const qty = Number(document.getElementById('pu_qty').value)||1;
  const cost = Number(document.getElementById('pu_cost').value)||0;
  currentPurchaseItems.push({ productId, size, qty, cost });
  renderPurchaseItemsArea(productsLiteCache||[]);
}
function renderPurchaseItemsArea(products){
  const area = document.getElementById('pu_items_area');
  if(currentPurchaseItems.length===0){
    area.innerHTML = '<div class="note">Nenhum item adicionado ainda.</div>';
    return;
  }
  let html = '<div class="items-editor">';
  let total = 0;
  currentPurchaseItems.forEach((it,idx)=>{
    const p = products.find(x=>x.id===it.productId);
    const subtotal = it.qty*it.cost;
    total += subtotal;
    html += '<div class="item-line"><span>'+escapeHtml(p?p.name:'?')+' ('+escapeHtml(it.size)+')</span><span>Qtd: '+it.qty+'</span><span>'+fmtMoney(it.cost)+'</span><span>'+fmtMoney(subtotal)+'</span><button class="btn small danger" onclick="removePurchaseItem('+idx+')">x</button></div>';
  });
  html += '<div class="total-line">Total: '+fmtMoney(total)+'</div></div>';
  area.innerHTML = html;
}
function removePurchaseItem(idx){
  currentPurchaseItems.splice(idx,1);
  renderPurchaseItemsArea(productsLiteCache||[]);
}
async function savePurchase(){
  if(currentPurchaseItems.length===0){ toast('Adicione ao menos um item.'); return; }
  const supplier = document.getElementById('pu_supplier').value.trim() || 'Fornecedor não informado';
  const date = document.getElementById('pu_date').value || todayISO();
  const total = currentPurchaseItems.reduce((s,it)=> s+it.qty*it.cost, 0);
  const inserted = await q(SUPA.from('purchases').insert([{ date, supplier, total, status:'pendente' }]).select());
  const purchaseId = inserted[0].id;
  await q(SUPA.from('purchase_items').insert(currentPurchaseItems.map(it=>({
    purchase_id: purchaseId, product_id: it.productId, size: it.size, qty: it.qty, cost: it.cost
  }))));
  closeModal();
  await renderCompras();
  toast('Compra registrada como pendente.');
}
async function receivePurchase(id){
  const rows = await q(SUPA.from('purchases').select('*, purchase_items(*)').eq('id', id));
  const pu = rows[0];
  if(!pu || pu.status==='recebido') return;
  for(const it of pu.purchase_items){
    await q(SUPA.rpc('adjust_stock', { p_product_id: it.product_id, p_size: it.size, p_delta: it.qty }));
  }
  await q(SUPA.from('purchases').update({ status:'recebido' }).eq('id', id));
  await q(SUPA.from('finance').insert([{ date: todayISO(), type:'despesa', category:'Compra de mercadoria', description:'Compra — '+pu.supplier, amount: pu.total, status:'pago', origin:'compra', ref_id: pu.id }]));
  await renderCompras();
  toast('Compra recebida: estoque e financeiro atualizados.');
}
async function deletePurchase(id){
  if(!confirm('Excluir esta compra? (não reverte estoque se já recebida)')) return;
  await q(SUPA.from('purchases').delete().eq('id', id));
  await renderCompras();
}

function addSaleItem(){

  const sellerId = document.getElementById('sa_seller').value || null;
  const total = currentSaleItems.reduce((s,it)=> s+it.qty*it.price, 0);
  const inserted = await q(SUPA.from('sales').insert([{ date, customer, payment, total, seller_id: sellerId }]).select());

    sale_id: saleId, product_id: it.productId, size: it.size, qty: it.qty, price: it.price
  }))));
  for(const it of currentSaleItems){
    await q(SUPA.rpc('adjust_stock', { p_product_id: it.productId, p_size: it.size, p_delta: -it.qty }));
  }
  await q(SUPA.from('finance').insert([{ date, type:'receita', category:'Venda', description:'Venda — '+(customer||'Cliente'), amount: total, status:'pago', origin:'venda', ref_id: saleId }]));
  closeModal();
  await renderVendas();
  toast('Venda registrada. Estoque e financeiro atualizados.');
}

function monthRange(monthStr){
  const parts = monthStr.split('-').map(Number);
  const y = parts[0], m = parts[1];
  const start = monthStr+'-01';
  const lastDay = new Date(y, m, 0).getDate();
  const end = monthStr+'-'+String(lastDay).padStart(2,'0');
  return { start: start, end: end };
}

async function calcComissoes(){
  const el = document.getElementById('comm_results');
  if(!el) return;
  el.innerHTML = '<div class="empty">Calculando...</div>';
  const period = document.getElementById('comm_period').value || todayISO().slice(0,7);
  const range = monthRange(period);
  const salesR = await SUPA.from('sales').select('total, seller_id, sellers(name, commission_percent)').gte('date', range.start).lte('date', range.end).not('seller_id','is',null);
  if(salesR.error){ console.error(salesR.error); el.innerHTML = MIGRACAO_FASE2_AVISO; return; }
  const paymentsR = await SUPA.from('commission_payments').select('*').eq('period_start', range.start).eq('period_end', range.end);
  if(paymentsR.error){ console.error(paymentsR.error); el.innerHTML = MIGRACAO_FASE2_AVISO; return; }
  const sales = salesR.data;
  const payments = paymentsR.data;
  const bySeller = {};
  sales.forEach(function(s){
    if(!s.seller_id) return;
    if(!bySeller[s.seller_id]){
      bySeller[s.seller_id] = { name: s.sellers?s.sellers.name:'?', percent: s.sellers?(Number(s.sellers.commission_percent)||0):0, total: 0 };
    }
    bySeller[s.seller_id].total += Number(s.total)||0;
  });
  const sellerIds = Object.keys(bySeller);
  if(sellerIds.length===0){
    el.innerHTML = '<div class="empty">Nenhuma venda com vendedora atribuída nesse período.</div>';
    return;
  }
  let html = '<div class="card"><table><tr><th>Vendedora</th><th>Total vendido</th><th>Comissão</th><th>Valor</th><th>Status</th><th></th></tr>';
  sellerIds.forEach(function(sid){
    const d = bySeller[sid];
    const totalRounded = round2(d.total);
    const commission = round2(d.total * (d.percent/100));
    const paid = payments.find(function(p){ return p.seller_id===sid; });
    html += '<tr><td>'+escapeHtml(d.name)+'</td><td>'+fmtMoney(totalRounded)+'</td><td>'+d.percent+'%</td><td>'+fmtMoney(commission)+'</td>';
    html += '<td>'+(paid?('<span class="tag ok">Pago em '+fmtDate(paid.paid_at)+'</span>'):'<span class="tag warn">Pendente</span>')+'</td>';
    html += '<td class="row-actions">'+(paid?'':('<button class="btn small" onclick="payCommission(\''+sid+'\',\''+range.start+'\',\''+range.end+'\','+totalRounded+','+commission+',\''+jsStr(d.name)+'\')">Marcar como pago</button>'))+'</td></tr>';
  });
  html += '</table></div>';
  el.innerHTML = html;
}

async function payCommission(sellerId, periodStart, periodEnd, totalSales, commissionAmount, sellerName){
  if(!confirm('Confirmar pagamento de '+fmtMoney(commissionAmount)+' de comissão para '+sellerName+'? Isso lança uma despesa no Financeiro.')) return;
  const mesLabel = new Date(periodStart+'T00:00:00').toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const inserted = await q(SUPA.from('finance').insert([{
    date: todayISO(), type:'despesa', category:'Comissão', description:'Comissão — '+sellerName+' ('+mesLabel+')',
    amount: commissionAmount, status:'pago', origin:'comissao'
  }]).select());
  await q(SUPA.from('commission_payments').insert([{
    seller_id: sellerId, period_start: periodStart, period_end: periodEnd,
    total_sales: totalSales, commission_amount: commissionAmount, finance_id: inserted[0].id
  }]));
  toast('Comissão paga e lançada no Financeiro.');
  await calcComissoes();
}

async function saveRecurring(id){

async function generateRecurringExpenses(){
  const recR = await SUPA.from('recurring_expenses').select('*').eq('active', true);
  if(recR.error){ toast('Erro: '+recR.error.message); return; }
  const recurring = recR.data;
  if(recurring.length===0){ toast('Nenhuma despesa fixa ativa cadastrada.'); return; }
  const monthStr = todayISO().slice(0,7);
  const range = monthRange(monthStr);
  const existingR = await SUPA.from('finance').select('recurring_expense_id').gte('date', range.start).lte('date', range.end).not('recurring_expense_id','is',null);
  if(existingR.error){ toast('Erro: '+existingR.error.message); return; }
  const already = new Set((existingR.data||[]).map(function(f){ return f.recurring_expense_id; }));
  const toCreate = recurring.filter(function(r){ return !already.has(r.id); });
  if(toCreate.length===0){ toast('As despesas fixas deste mês já foram lançadas.'); return; }
  const lastDay = Number(range.end.split('-')[2]);
  const rows = toCreate.map(function(r){
    const day = Math.min(r.day_of_month||1, lastDay);
    const dueDate = monthStr+'-'+String(day).padStart(2,'0');
    return { date: todayISO(), due_date: dueDate, type:'despesa', category: r.category||'Despesa fixa', description: r.description, amount: r.amount, status:'pendente', origin:'recorrente', recurring_expense_id: r.id };
  });
  const insR = await SUPA.from('finance').insert(rows);
  if(insR.error){ toast('Erro: '+insR.error.message); return; }
  toast(toCreate.length+' despesa(s) fixa(s) lançada(s) para este mês.');
  await renderFinanceiro();
}

/* ---------- DRE simplificado ---------- */
async function calcDRE(){
  const el = document.getElementById('dre_results');
  if(!el) return;
  el.innerHTML = '<div class="empty">Calculando...</div>';
  const period = document.getElementById('dre_period').value || todayISO().slice(0,7);
  const range = monthRange(period);
  const financeR = await SUPA.from('finance').select('type, amount').gte('date', range.start).lte('date', range.end);
  if(financeR.error){ el.innerHTML = '<div class="empty">Erro ao calcular.</div>'; return; }
  const receita = financeR.data.filter(function(f){ return f.type==='receita'; }).reduce(function(s,f){ return s+Number(f.amount||0); }, 0);
  const despesa = financeR.data.filter(function(f){ return f.type==='despesa'; }).reduce(function(s,f){ return s+Number(f.amount||0); }, 0);
  const salesR = await SUPA.from('sales').select('id').gte('date', range.start).lte('date', range.end);
  let cmv = 0;
  if(!salesR.error && salesR.data.length){
    const saleIds = salesR.data.map(function(s){ return s.id; });
    const itemsR = await SUPA.from('sale_items').select('qty, products(cost_price)').in('sale_id', saleIds);
    if(!itemsR.error){
      cmv = itemsR.data.reduce(function(s,it){ return s + (Number(it.qty)||0) * (it.products?(Number(it.products.cost_price)||0):0); }, 0);
    }
  }
  const lucroBruto = receita - cmv;
  const lucroLiquido = lucroBruto - despesa;
  let html = '<div class="card"><table>';
  html += '<tr><td>Receita total</td><td style="text-align:right;">'+fmtMoney(receita)+'</td></tr>';
  html += '<tr><td>(–) Custo dos produtos vendidos (CMV)</td><td style="text-align:right;">'+fmtMoney(cmv)+'</td></tr>';
  html += '<tr><td><strong>= Lucro bruto</strong></td><td style="text-align:right;"><strong>'+fmtMoney(lucroBruto)+'</strong></td></tr>';
  html += '<tr><td>(–) Despesas do período</td><td style="text-align:right;">'+fmtMoney(despesa)+'</td></tr>';
  html += '<tr><td><strong>= Lucro líquido</strong></td><td style="text-align:right;"><strong style="'+(lucroLiquido<0?'color:#c0392b;':'')+'">'+fmtMoney(lucroLiquido)+'</strong></td></tr>';
  html += '</table></div>';
  el.innerHTML = html;
}

/* ---------- Exportar CSV ---------- */
function exportFinanceCSV(){
  const rows = financeCache||[];
  if(rows.length===0){ toast('Nada para exportar.'); return; }
  let csv = 'Data;Vencimento;Tipo;Categoria;Descricao;Valor;Status\n';
  rows.forEach(function(f){
    const cols = [
      fmtDate(f.date), f.due_date?fmtDate(f.due_date):'', (f.type==='receita'?'Receita':'Despesa'),
      (f.category||''), (f.description||''), String(f.amount||0).replace('.',','), (f.status==='pago'?'Pago':'Pendente')
    ];
    csv += cols.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';') + '\n';
  });
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'financeiro-'+todayISO()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    html += '<div class="note">Dica: configure o WhatsApp da loja em <strong>Configurações</strong> para o botão "Finalizar pedido" funcionar.</div>';
  }
  html += '<button class="btn gold" onclick="generateCatalog()">⬇️ Publicar / atualizar catálogo (baixar HTML)</button>';
  html += '</div>';
  html += '<div class="note" style="margin-top:16px;">Baixe o arquivo <code>catalogo-jjsolene.html</code> e hospede como preferir (ex: GitHub Pages, igual ao catálogo do Rafa 3D). Como ele consulta o banco de dados ao vivo, mudanças de estoque, preço ou produtos aparecem automaticamente pros clientes — só é preciso publicar de novo se mudar o visual ou trocar de projeto no Supabase.</div>';
  el.innerHTML = html;
}
async function generateCatalog(){
  const url = localStorage.getItem(SB_URL_KEY) || DEFAULT_SB_URL;
  const key = localStorage.getItem(SB_ANON_KEY) || DEFAULT_SB_ANON;
  const html = buildCatalogHTML(url, key);
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'catalogo-jjsolene.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  await q(SUPA.from('settings').update({ last_catalog_generated: new Date().toISOString() }).eq('id',1));
  await renderCatalogoTab();
  toast('Catálogo publicado e baixado.');
}

'};',
'function normalizeCatName(name){',
'  return (name||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]/g,"");',
'}',
'function formatCatLabel(name){',
'  var n = name || "";',
'  if(n.indexOf("/") !== -1){',
'    var parts = n.split("/").map(function(p){ return p.trim(); });',
'    if(parts.length === 2 && parts[0].toLowerCase() === "bermudas" && parts[1].toLowerCase() === "shorts"){ parts = [parts[1], parts[0]]; }',
'    return esc(parts[0]) + " &<br>" + esc(parts.slice(1).join("/"));',
'  }',
'  return esc(n);',
'}',
'function pickCategoryIcon(name){',
'  var key = normalizeCatName(name);',
'  if(CAT_ICON_IMAGES[key]) return "<img src=\\""+CAT_ICON_IMAGES[key]+"\\">";',
'  var n = (name||"").toLowerCase();',
'  if(n.indexOf("saia")!==-1) return CAT_ICONS.skirt;',
'  if(n.indexOf("vestido")!==-1) return CAT_ICONS.dress;',
'  if(n.indexOf("conjunto")!==-1) return CAT_ICONS.conjunto;',
'  if(n.indexOf("cal") !== -1 || n.indexOf("bermuda")!==-1 || n.indexOf("short")!==-1 || n.indexOf("jeans")!==-1) return CAT_ICONS.pants;',
'  if(n.indexOf("moletom")!==-1 || n.indexOf("casaco")!==-1 || n.indexOf("jaqueta")!==-1 || n.indexOf("cardig")!==-1) return CAT_ICONS.hoodie;',
'  if(n.indexOf("pijama")!==-1 || n.indexOf("dorm")!==-1) return CAT_ICONS.moon;',
'  if(n.indexOf("praia")!==-1 || n.indexOf("biquini")!==-1 || n.indexOf("maio")!==-1) return CAT_ICONS.sun;',
'  if(n.indexOf("fitness")!==-1 || n.indexOf("academia")!==-1 || n.indexOf("legging")!==-1) return CAT_ICONS.dumbbell;',
'  if(n.indexOf("acess")!==-1 || n.indexOf("promo")!==-1 || n.indexOf("bolsa")!==-1 || n.indexOf("bijuteria")!==-1) return CAT_ICONS.tag;',
'  if(n.indexOf("blusa")!==-1 || n.indexOf("camis")!==-1 || n.indexOf("regata")!==-1 || n.indexOf("cropped")!==-1) return CAT_ICONS.hanger;',
'  return CAT_ICONS.hanger;',
'}',
'async function loadData(){',
'  var s = await sb.from("settings").select("*").eq("id",1).limit(1);',
'  var c = await sb.from("categories").select("*").order("sort_order");',
'  var p = await sb.from("products").select("*, product_sizes(*)").eq("show_in_catalog", true).order("name");',
'  var m = await sb.from("product_media").select("*").order("sort_order");',
'  var b = await sb.from("banners").select("*").order("sort_order");',
'  var g = await sb.from("gift_rules").select("*, products(id,name,sale_price,image_url,product_sizes(*))").order("min_total");',
'  CATALOG.settings = (s.data && s.data[0]) || {};',
'  CATALOG.categories = c.data || [];',
'  CATALOG.products = p.data || [];',
'  CATALOG.media = m.data || [];',
'  CATALOG.banners = b.data || [];',
'  CATALOG.giftRules = g.data || [];',
'  if(CATALOG.settings.store_name){ document.title = CATALOG.settings.store_name; }',
'  if(CATALOG.settings.logo_url){',
'    var link = document.querySelector("link[rel~=\'icon\']");',
'    if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }',
'    link.href = CATALOG.settings.logo_url;',
'  }',
'  buildApp();',
'}',
'function mediaFor(productId){ return CATALOG.media.filter(function(mm){ return mm.product_id===productId; }); }',
'function availSizes(p){',
'  return (p.product_sizes||[]).map(function(sz){ return { size: sz.size, avail: (Number(sz.stock)||0) - (Number(sz.reserved)||0) }; });',
'}',
'function heroSlides(data){',
'  if(data.banners && data.banners.length){ return data.banners.map(function(b){ return { image: b.image_url, link: b.link_url }; }); }',
'  if(data.settings.banner_url){ return [{ image: data.settings.banner_url, link: "" }]; }',
'  return [{ image: "", link: "" }];',
'}',
'function buildHeroCarousel(data){',
'  var slides = heroSlides(data);',
'  var wrap = document.createElement("div"); wrap.className="hero-carousel"; wrap.id="heroCarousel";',
'  slides.forEach(function(s, i){',
'    var slide = document.createElement("div"); slide.className="hero-slide"+(i===0?" active":"");',
'    if(s.image){',
'      var img=document.createElement("img"); img.src=s.image; img.alt="";',
'      slide.appendChild(img);',
'      slide.style.cursor="pointer";',
'      slide.onclick = s.link ? function(){ window.open(s.link,"_blank"); } : function(){ switchTab("novidades"); };',
'    } else {',
'      var cta = document.createElement("button"); cta.className="hero-cta"; cta.textContent="VER COLEÇÃO";',
'      cta.onclick = function(e){ e.stopPropagation(); switchTab("novidades"); };',
'      var textFallback = document.createElement("div"); textFallback.className="hero-slide-textonly";',
'      textFallback.innerHTML = "<h1>"+esc(data.settings.tagline||data.settings.store_name||"Bem-vinda!")+"</h1><p>"+esc(data.settings.delivery_text||"")+"</p>";',
'      textFallback.appendChild(cta);',
'      slide.appendChild(textFallback);',
'      if(s.link){ slide.style.cursor="pointer"; slide.onclick=function(){ window.open(s.link,"_blank"); }; }',
'    }',
'    wrap.appendChild(slide);',
'  });',
'  if(slides.length>1){',
'    var dots = document.createElement("div"); dots.className="hero-dots";',
'    slides.forEach(function(s,i){',
'      var d = document.createElement("span"); if(i===0) d.className="active";',
'      d.onclick = function(){ goToHeroSlide(i); };',
'      dots.appendChild(d);',
'    });',
'    wrap.appendChild(dots);',
'    CATALOG._heroTimer && clearInterval(CATALOG._heroTimer);',
'    CATALOG._heroTimer = setInterval(function(){ goToHeroSlide((CATALOG.heroSlide+1) % slides.length); }, 5000);',
'  }',
'  return wrap;',
'}',
'function goToHeroSlide(i){',
'  var wrap = document.getElementById("heroCarousel");',
'  if(!wrap) return;',
'  CATALOG.heroSlide = i;',
'  Array.prototype.forEach.call(wrap.querySelectorAll(".hero-slide"), function(el,idx){ el.classList.toggle("active", idx===i); });',
'  Array.prototype.forEach.call(wrap.querySelectorAll(".hero-dots span"), function(el,idx){ el.classList.toggle("active", idx===i); });',
'}',
'function buildCategoryIcons(data){',
'  var row = document.createElement("div"); row.className="cat-icons-row";',
'  data.categories.forEach(function(c){',
'    var has = data.products.some(function(p){return p.category_id===c.id;});',
'    if(!has) return;',

async function saveConfig(){
  await q(SUPA.from('settings').update({
    store_name: document.getElementById('cf_name').value.trim() || 'Loja',
    tagline: document.getElementById('cf_tagline').value.trim(),
    instagram: document.getElementById('cf_ig').value.trim(),
    whatsapp: document.getElementById('cf_wpp').value.trim(),
    delivery_text: document.getElementById('cf_delivery').value.trim(),
    pix_key: document.getElementById('cf_pix').value.trim(),
    pix_titular: document.getElementById('cf_pixname').value.trim(),
    sinal_percent: Math.min(100, Math.max(1, Number(document.getElementById('cf_sinal').value)||100)),
    payment_note: document.getElementById('cf_paynote').value.trim(),
    infinitepay_handle: document.getElementById('cf_infinitetag').value.trim().replace(/^\$/,''),
    cashback_percent: Number(document.getElementById('cf_cashback').value)||0,
    attendant1_name: document.getElementById('cf_at1_name').value.trim(),
    attendant1_phone: document.getElementById('cf_at1_phone').value.trim(),
    attendant2_name: document.getElementById('cf_at2_name').value.trim(),
    attendant2_phone: document.getElementById('cf_at2_phone').value.trim(),
    updated_at: new Date().toISOString()
  }).eq('id',1));
  toast('Configurações salvas.');
  await renderConfig();
}
async function uploadBrandImage(input, field){
  const file = input.files[0];
  if(!file) return;
  const previewId = field==='logo_url' ? 'cf_logo_preview' : 'cf_banner_preview';
  const preview = document.getElementById(previewId);
  preview.src = URL.createObjectURL(file);
  preview.classList.remove('hidden');
  try{
    const path = 'branding/' + field + '_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
    const { error: upErr } = await SUPA.storage.from('product-images').upload(path, file, { upsert:true });
    if(upErr){ toast('Erro no upload: '+upErr.message); return; }
    const { data: pub } = SUPA.storage.from('product-images').getPublicUrl(path);
    const payload = {}; payload[field] = pub.publicUrl;
    await q(SUPA.from('settings').update(payload).eq('id',1));
    toast('Imagem salva.');
  } catch(e){ /* q() já mostra o erro */ }
}
async function addCategory(){
  const icon = document.getElementById('cat_icon').value.trim() || '🏷️';
  const name = document.getElementById('cat_name').value.trim();
  if(!name){ toast('Informe o nome da categoria.'); return; }
  await q(SUPA.from('categories').insert([{ name, icon }]));
  await renderConfig();
}
async function deleteCategory(id){
  const products = await q(SUPA.from('products').select('id').eq('category_id', id));
  if(products.length){
    alert('Existem produtos nesta categoria. Mude a categoria deles antes de excluir.');
    return;
  }
  if(!confirm('Excluir esta categoria?')) return;
  await q(SUPA.from('categories').delete().eq('id', id));
  await renderConfig();
}
